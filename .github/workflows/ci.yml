name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + build + test)
        run: npm run verify

      # Visibility only — prints the coverage summary to the job log. Not a gate
      # (no thresholds), so it never fails the build (HBSP-12, per the review).
      - name: Coverage (informational, no gate)
        if: matrix.node == 20
        continue-on-error: true
        run: npm run coverage

  # Mutation testing (HBSP-34). Runs as its own job so it does not slow the
  # verify matrix.
  #
  # The SCORE never gates: `thresholds.break` is null in stryker.config.json, so
  # Stryker does not exit non-zero however low the score falls -- the same
  # visibility-only stance the coverage step above takes (HBSP-12).
  #
  # The LANE does gate, deliberately. Because a low score cannot produce a
  # non-zero exit, any non-zero exit means Stryker itself failed: a crash, a bad
  # config, an unsupported runtime. A mutation job that silently reports nothing
  # is worse than no job at all, so there is no continue-on-error here and a
  # missing report is an upload error rather than a warning.
  #
  # Node 24: StrykerJS requires Node >=22. The library itself still supports
  # Node 20 (see the verify matrix and package.json engines) -- this floor
  # belongs to the dev tool, not to the package.
  mutation:
    name: mutation score (informational, no gate)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mutation test
        run: npm run mutate

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14
